name: photopod
version: 0.1.8
summary: Privacy preserving photo manager.
description: |
  PhotoPod collects your photos and securely stores them encrypted in
  your personal online data store (Pod) within a Data Vault hosted by
  your Solid Server of choice.

base: core24
grade: stable
confinement: strict

# 20251013 gjw Plugins that may be needed include the following, but are
# not required for every app:
#
#      - audio-playback
#      - pulseaudio
#      - screen-inhibit-control

apps:
  photopod:
    command: photopod
    extensions: [gnome] # gnome includes the libraries required by flutter
    plugs:
      # 20260925 gjw audio-playback so the media_kit video preview has
      # sound under strict confinement.
      - audio-playback
      - desktop
      - desktop-legacy
      - home
      - network
      - opengl
      - wayland
      - x11

# 20251013 gjw The `flutter_secure_storage` package (and maybe
# `vault_storage`) is used by `solidpod/solidui` to save secrets
# locally, if the app provides this option to the user to do so. Thus
# `libsecret-1-dev`, `libjsoncpp-dev`, `llvm`, and `lld` at least are
# required to build the installer and `libsecret-1-0` and
# `libjsoncpp1` to run the application. There may be more that are
# included below and need to test their removal to test. See
#
# https://github.com/juliansteenbakker/flutter_secure_storage/blob/develop/README.md
# https://pub.dev/packages/vault_storage/versions/2.2.0#platform-setup
#
#    build-packages:
#      - libsecret-1-dev
#      - libjsoncpp-dev
#      - llvm
#      - lld
#
#    stage-packages:
#      - libsecret-1-0
#      - libjsoncpp-dev
#
# 20251013 gjw If using the `audioplayers` package for flutter then
# the gstreamer packages are required for bulding the installer
# running the app.
#
#    build-packages:
#      - libgstreamer1.0-dev
#      - libgstreamer-plugins-base1.0-dev
#      - libgstreamer-plugins-good1.0-dev
#    stage-packages:
#      - libgstreamer1.0-0
#      - libgstreamer-plugins-base1.0-0
#      - libgstreamer-plugins-good1.0-0
#      - gstreamer1.0-plugins-good
#      - gstreamer1.0-plugins-base

parts:
  photopod:
    source: .
    plugin: flutter
    flutter-target: lib/main.dart
    # 20260925 gjw libasound2-dev and libmpv-dev are for media_kit,
    # used for the video preview. volume_controller (a
    # media_kit_video dependency) does find_package(ALSA), and
    # media_kit links against libmpv. Without them the build fails at
    # the cmake configure step with "Could NOT find ALSA". The snap
    # builds in its own container, so these have to be listed here as
    # well as in LINUX_PKGS in .github/workflows/installers.yaml.
    build-packages:
      - binutils
      - clang
      - cmake
      - libasound2-dev
      - libblkid-dev
      - libgtk-3-dev
      - libjsoncpp-dev
      - liblzma-dev
      - libmpv-dev
      - libsecret-1-dev
      - libssl-dev
      - lld
      - llvm
      - ninja-build
    stage-packages:
      - libasound2t64
      - libgtk-3-0
      - libjsoncpp-dev
      - libmpv2
      - libsecret-1-0
      - libssl3
