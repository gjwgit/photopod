# Configure the analyzer for static analysis of Dart code.
#
# Add the following to pubspec.yaml:
#
#   dev_dependencies:
#     flutter_lints: ^6.0.0
#
# Invoke the analyzer from the command line:
#
#   flutter analyze

# Activate recommended lints for Flutter apps, packages, and plugins
# designed to encourage good coding practices.

include: package:flutter_lints/flutter.yaml

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
    require_trailing_commas: true
    directives_ordering: false
    prefer_const_constructors: true

# Identify directories to ignore.

analyzer:

  # Flutter deprecates package:flutter/material.dart in favour of
  # package:material_ui, and `dart fix --apply` (run by `make prep`) moves
  # every import across. Its Material, Theme and ScaffoldMessenger are
  # distinct classes from those of package:flutter/material.dart, which
  # solidui's SolidThemeApp and SolidScaffold are built from, so a migrated
  # TextField asserts "No Material widget found" (see the same note on
  # flutter_form_builder in solidui's pubspec.yaml). Silencing the
  # deprecation keeps `dart fix` from migrating. Remove this once solidui has
  # moved to package:material_ui, and migrate with it.

  errors:
    deprecated_member_use: ignore

  exclude:
    - ignore/**
    - ignore/
    - build/**
    # Generated by protoc from support/teepod/classifier.proto.
    - lib/services/teepod/generated/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
