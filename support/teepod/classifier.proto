syntax = "proto3";

package classifier.v2;

service ImageAnalyzer {
  // Returns a Confidential Space attestation token whose nonces bind
  // (a) the caller's fresh nonce and (b) the SHA-256 of the server's TLS cert.
  // A client that verifies this token knows the TLS key lives inside the TEE.
  rpc Attest(AttestRequest) returns (AttestResponse);

  // Bidirectional stream: the client sends images as fast as it likes, each
  // naming the service to run on it; the server returns results as they
  // complete (possibly out of order; match them with request_id). One stream
  // may mix both services.
  rpc AnalyzeStream(stream ImageRequest) returns (stream ImageResult);
}

message AttestRequest {
  string nonce = 1;  // 32-64 lowercase hex chars, freshly generated by the client
}

message AttestResponse {
  string token = 1;        // signed JWT from the Confidential Space attestation service
  string cert_sha256 = 2;  // hex SHA-256 of the server's DER-encoded TLS certificate
}

enum Service {
  SERVICE_UNSPECIFIED = 0;  // rejected: the client must choose
  FACE_RECOGNITION = 1;     // InsightFace buffalo_l: SCRFD-10GF + ArcFace R50
  IMAGE_TAGGING = 2;        // SigLIP ViT-B/16 (WebLI), zero-shot over the tag vocabulary
}

message ImageRequest {
  string request_id = 1;
  bytes image = 2;            // encoded JPEG / PNG / WebP bytes (EXIF orientation honoured)
  Service service = 3;

  // FACE_RECOGNITION options
  int32 max_faces = 10;       // 0 = all (server caps at 50); largest faces first

  // IMAGE_TAGGING options
  int32 top_k = 20;           // default 5, max 50
  optional float min_score = 21;  // drop tags whose cosine similarity is below this
}

message Point {
  float x = 1;
  float y = 2;
}

message BoundingBox {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
}

message Face {
  BoundingBox box = 1;              // pixels, in the EXIF-oriented image
  float score = 2;                  // detection confidence
  repeated Point landmarks = 3;     // left eye, right eye, nose, left/right mouth corner
  repeated float embedding = 4;     // 512-d unit vector; compare faces by dot product
}

message FaceResult {
  repeated Face faces = 1;
  int32 image_width = 2;
  int32 image_height = 3;
}

message Tag {
  string name = 1;
  float score = 2;  // cosine similarity; only the ranking is meaningful
}

message TagResult {
  repeated Tag tags = 1;
}

message ImageResult {
  string request_id = 1;
  Service service = 2;
  oneof result {
    FaceResult faces = 3;
    TagResult tags = 4;
  }
  string error = 5;  // set instead of a result if this image failed
}
