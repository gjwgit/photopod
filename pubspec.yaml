name: photopod
description: "Photo Pod - Photo Management with Secure and Private Storage"
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: ^3.11.3

# 20260830 gjw To automatically upgrade package dependencies:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  # Graham's own text field with Emacs-style keybindings, used for the photo
  # caption editor in the photo details dialog.
  emacs_text_field: ^0.1.3

  # Pick photos to upload, and choose a save location when exporting a photo
  # or a whole album back out of the Pod.
  file_picker: ^12.3.0

  # Small fixed-size spacing widget, used throughout the layout in place of
  # bare SizedBoxes.
  gap: ^3.0.1

  # JPEG encoding of the downscaled thumbnails generated at upload time. The
  # decode/downscale itself goes through dart:ui (the platform codec), so this
  # only ever encodes a small image.
  image: ^4.8.0

  # Graham's own drop-in Tooltip replacement with Markdown rendering and a
  # popup delay, used for every tooltip in the app.
  markdown_tooltip: ^0.0.10

  # State management: AppProvider is a ChangeNotifier read/watched via
  # provider throughout the screens.
  provider: ^6.1.5

  # Device-local display preferences (ViewPrefs), never synced to the Pod.
  shared_preferences: ^2.3.0

  # Solid Pod storage and encryption: read/write the encrypted photo files
  # and the photo index on the user's Pod.
  solidpod: ^1.0.22

  # Solid app scaffold, login flow, and shared settings/about UI.
  solidui: ^1.0.41

  # Generate stable unique identifiers for each photo.
  uuid: ^4.5.3

  # Restore the last window size/position on Linux/macOS/Windows desktop.
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the platform launcher icons from assets/images/app_icon.png.
  # Re-run after changing the icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg
  uses-material-design: true

# 20260830 gjw Define launcher icons for all platforms (except Linux)
# so icons for the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
