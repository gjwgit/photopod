name: photopod
description: "Photo Pod - Photo Management with Secure and Private Storage"
publish_to: 'none'
version: 1.3.10+32

environment:
  sdk: ^3.11.3

# 20260830 gjw To automatically upgrade package dependencies:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  # SHA-256, which names the entry for each shared key in the user's Pod, so
  # that declining a share can find and remove the key that came with it.
  crypto: ^3.0.6

  # Accept photos and videos dragged from the desktop onto the Library, as
  # an alternative to picking them with the Add button.
  desktop_drop: ^0.8.4

  # Pick photos and videos to add to the Pod, and choose a local save
  # location when downloading a file back out of the Pod.
  file_picker: ^13.3.0

  # OpenStreetMap-backed map for the Maps section, which places each photo by
  # the GPS coordinates its camera wrote into the file. flutter_map is pure
  # Flutter and needs no API key or platform-specific map SDK, so the same
  # code works on every platform PhotoPod builds for.
  flutter_map: ^8.3.1

  # Small fixed-size spacing widget, used throughout the layout in place of
  # bare SizedBoxes.
  gap: ^3.0.1

  # TeePod, the trusted image analyser the native builds use, is a gRPC
  # service. See lib/services/teepod/; the messages are generated from
  # support/teepod/classifier.proto.

  grpc: ^5.2.0

  # Authenticated REST calls to the Solid server. The DPoP tokens themselves
  # come from solidpod; we issue the GET/PUT/DELETE requests ourselves so
  # photos and videos are stored as ordinary binary resources.
  http: ^1.2.0

  # TIFF decoding (Flutter has no built-in TIFF codec) and downscaling of
  # photos into the small thumbnails shown in the grid.
  image: ^4.8.0

  # Video playback for the preview dialog. media_kit is used in preference to
  # video_player because it covers Linux and Windows as well as Android, iOS,
  # macOS and the web.
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7

  # Put a photo on the clipboard, from the preview's Share button on the
  # desktop and the web, so that it can be pasted into Signal, WhatsApp,
  # Teams or any other application. Flutter's own Clipboard holds only text.
  pasteboard: ^0.6.1

  # A temporary folder to hold a copy of a file placed on the clipboard as a
  # file, where an image cannot be placed there directly.
  path_provider: ^2.1.5

  # The latitude/longitude pair flutter_map speaks in.
  latlong2: ^0.9.1

  # Graham's own drop-in Tooltip replacement with Markdown rendering and a
  # popup delay, used for every tooltip in the app.
  markdown_tooltip: ^0.0.10

  # Checking the RS256 signature on TeePod's attestation token, with
  # Google's published keys. See lib/services/teepod/attestation.dart.

  pointycastle: ^4.0.0

  # The messages TeePod speaks, as generated into
  # lib/services/teepod/generated/.

  protobuf: ^6.1.0

  # State management: the view preferences notifier is read/watched via
  # provider throughout the screens.
  provider: ^6.1.5

  # The platform's own share sheet, for sharing a photo or video from the
  # preview to Signal, WhatsApp, Teams, email and the like. This is ordinary
  # sharing of a copy, quite apart from sharing on the Pod by WebID.
  share_plus: ^13.3.1

  # Device-local display preferences (ViewPrefs), never synced to the Pod.
  shared_preferences: ^2.3.0

  # Solid Pod storage and sharing: read/write the photo and video files on
  # the user's Pod and grant access permissions to other WebIDs.
  solidpod: ^1.1.2

  # Solid app scaffold, login flow, sharing UI, and shared settings/about UI.
  solidui: ^1.5.15

  # Restore the last window size/position on Linux/macOS/Windows desktop.
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the platform launcher icons from assets/images/app_icon.png.
  # Re-run after changing the icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg

    # The sample album shown to anyone not logged in. See
    # lib/services/demo_library.dart.

    - assets/demo/

    # The cities and regions photos are grouped under when sorted by
    # location, from GeoNames (CC BY 4.0). See support/make_place_regions.py.

    - assets/places/regions.tsv

    # Where the Analyser is: its WebID. See lib/constants/analyser.dart.

    - assets/config/analyser.json

    # Where TeePod is, and the container image it must prove it runs. See
    # lib/constants/teepod.dart.

    - assets/config/teepod.json

    # TeePod's client certificate and key, kept out of git. Never bundled
    # with the web build, which cannot reach TeePod: see the README.md there.

    - path: assets/config/teepod/
      platforms: [android, ios, linux, macos, windows]
  uses-material-design: true

# 20260830 gjw Define launcher icons for all platforms (except Linux)
# so icons for the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21

  # 20261117 gjw An ADAPTIVE icon for Android, as for timepod. The
  # foreground is the bowl alone on transparency, inside the safe zone, over
  # a deep blue that lifts the white bowl. app_icon_android.png is the two
  # combined, square, for the legacy icon, matching the adaptive one. The
  # foreground is already padded to the safe zone, so no further inset.

  image_path_android: "assets/images/app_icon_android.png"
  adaptive_icon_background: "#1E4FA0"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  adaptive_icon_foreground_inset: 0

  # 20261117 gjw There is no ios/ project yet, and generating for it then
  # fails before the other platforms are done. Turn this on once ios/ is
  # added. The blue matches Android, since a white plate loses the bowl.

  ios: false
  remove_alpha_ios: true
  background_color_ios: "#1E4FA0"
  macos:
    generate: true

  # 20261117 gjw The web icons include MASKABLE ones, which a phone crops to
  # its own shape, so they need a full background with the art inside the
  # middle 80%. The square blue icon is drawn to suit.

  web:
    generate: true
    image_path: "assets/images/app_icon_android.png"
    background_color: "#ffffff"
    theme_color: "#ffffff"

  # 20261117 gjw The largest size Windows takes, so it is not blurred when
  # shown large.

  windows:
    generate: true
    icon_size: 256 # min:48, max:256, default: 48
