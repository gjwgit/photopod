name: photopod
description: "Photo Pod - Photo Management with Secure and Private Storage"
publish_to: 'none'
version: 0.1.7+1

environment:
  sdk: ^3.11.3

# 20260830 gjw To automatically upgrade package dependencies:
#
#   flutter pub upgrade --major-versions
#
# To see which dependencies have newer versions available:
#
#   flutter pub outdated

dependencies:
  flutter:
    sdk: flutter

  # Pick photos and videos to add to the Pod, and choose a local save
  # location when downloading a file back out of the Pod.
  file_picker: ^12.3.0

  # OpenStreetMap-backed map for the Maps section, which places each photo by
  # the GPS coordinates its camera wrote into the file. flutter_map is pure
  # Flutter and needs no API key or platform-specific map SDK, so the same
  # code works on every platform PhotoPod builds for.
  flutter_map: ^8.3.1

  # Small fixed-size spacing widget, used throughout the layout in place of
  # bare SizedBoxes.
  gap: ^3.0.1

  # Authenticated REST calls to the Solid server. The DPoP tokens themselves
  # come from solidpod; we issue the GET/PUT/DELETE requests ourselves so
  # photos and videos are stored as ordinary binary resources.
  http: ^1.2.0

  # TIFF decoding (Flutter has no built-in TIFF codec) and downscaling of
  # photos into the small thumbnails shown in the grid.
  image: ^4.8.0

  # Video playback for the preview dialog. media_kit is used in preference to
  # video_player because it covers Linux and Windows as well as Android, iOS,
  # macOS and the web.
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # The latitude/longitude pair flutter_map speaks in.
  latlong2: ^0.9.1

  # Graham's own drop-in Tooltip replacement with Markdown rendering and a
  # popup delay, used for every tooltip in the app.
  markdown_tooltip: ^0.0.10

  # State management: the view preferences notifier is read/watched via
  # provider throughout the screens.
  provider: ^6.1.5

  # Device-local display preferences (ViewPrefs), never synced to the Pod.
  shared_preferences: ^2.3.0

  # Solid Pod storage and sharing: read/write the photo and video files on
  # the user's Pod and grant access permissions to other WebIDs.
  solidpod: ^1.0.24

  # Solid app scaffold, login flow, sharing UI, and shared settings/about UI.
  solidui: ^1.1.3

  # Restore the last window size/position on Linux/macOS/Windows desktop.
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the platform launcher icons from assets/images/app_icon.png.
  # Re-run after changing the icon: dart run flutter_launcher_icons
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/images/app_icon.png
    - assets/images/app_image.jpg
  uses-material-design: true

# 20260830 gjw Define launcher icons for all platforms (except Linux)
# so icons for the apps can be automatically updated using:
#
# `dart run flutter_launcher_icons`

flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: true
  min_sdk_android: 21
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#ffffff"
  macos:
    generate: true
  web:
    generate: true
    background_color: "#ffffff"
    theme_color: "#ffffff"
  windows:
    generate: true
    icon_size: 48 # min:48, max:256, default: 48
